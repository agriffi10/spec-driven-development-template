name: Docs Lint

# Holds the always-loaded tier to its budgets and the digest/register split to its
# shape (scripts/docs-lint.sh). Until this existed the rules were prose only, and in a
# sibling project running this template every one of them was violated anyway — its
# CLAUDE.md grew 11x in eight weeks while its own docs named the violation.
#
# Deliberately NOT path-filtered, for the reason check-mirror.yml gives: a filter would
# have to name every doc the script reads to be correct, and the failure it must catch
# is growth arriving in a path nobody thought to list. The script is POSIX sh over a
# handful of files — it costs a second.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hold the always-loaded tier to its budgets
        run: sh scripts/docs-lint.sh

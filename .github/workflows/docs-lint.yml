name: Docs Lint

# Holds the always-loaded tier to its budgets and the digest/register split to its
# shape (scripts/docs-lint.sh). Until this existed the rules were prose only, and in a
# sibling project log-forge every one of them was violated anyway — its
# CLAUDE.md grew 11x in eight weeks while its own docs named the violation.
#
# Deliberately NOT path-filtered, for the reason check-mirror.yml gives: a filter would
# have to name every doc the script reads to be correct, and the failure it must catch
# is growth arriving in a path nobody thought to list. The script is POSIX sh over a
# handful of files — it costs a second.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Parse first, as its own step. A syntax error partway through a shell script can
      # end the run with status 0 — the linter never reaches its checks and CI goes green
      # on a linter that did nothing. That happened once while this script was written.
      - name: Check the linter itself parses
        run: sh -n scripts/docs-lint.sh
      # The corpus proves the CHECKS work. Running the linter against this repo's own
      # documents only proves the documents pass — a linter whose checks have stopped
      # firing is indistinguishable from a healthy repo, which is how four rounds of
      # regressions all reached main.
      - name: Prove the linter's checks still fire
        run: sh scripts/docs-lint-test.sh
      - name: Hold the always-loaded tier to its budgets
        run: sh scripts/docs-lint.sh
